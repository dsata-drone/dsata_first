function shade(hex,amt){
  const n=parseInt(hex.slice(1),16);
  const f=v=>Math.max(0,Math.min(255,v+amt));
  const r=f(n>>16),g=f((n>>8)&255),b=f(n&255);
  return "#"+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);

function makeSprite(w,dir,legs){
  const c=document.createElement("canvas");c.width=20;c.height=28;
  const g=c.getContext("2d");
  const map={O:PAL.O,S:PAL.S,T:PAL.T,E:PAL.E,W:PAL.W,
    H:w.hair,G:shade(w.hair,46),F:shade(w.hair,-34),
    B:w.shirt,D:shade(w.shirt,-34)};
  BODY20[dir].forEach((row,y)=>{[...row].forEach((ch,x)=>{
    const col=map[ch];
    if(col){g.fillStyle=col;g.fillRect(x,y,1,1);}
  });});
  paintLegs(g,w.pants,legs);
  paintAcc(g,w,dir);
  // 陰影(source-atopでキャラのシルエット内だけに適用)
  g.globalCompositeOperation="source-atop";
  g.fillStyle="rgba(20,16,30,.14)"; g.fillRect(14,3,6,23);   // 右側の陰
  g.fillStyle="rgba(255,250,240,.12)"; g.fillRect(2,2,5,7);  // 左上のハイライト
  g.globalCompositeOperation="source-over";
  return c;
}

function freeSpot(){
  const o=SPOTS.filter(s=>!s.taken);
  return o.length?o[Math.floor(Math.random()*o.length)]:null;
}
function workDur(w){return 6+w.load*22+Math.random()*6;}
function restDur(w){return 4+(1-w.load)*24+Math.random()*6;}
const workers=TEAM.map(t=>{
  const w={...t, seat:{x:t.desk.x+DESK_W/2, y:t.desk.y+33},
    walkY:(t.desk.y>500?WALK_Y4:t.desk.y>390?WALK_Y3:t.desk.y>260?WALK_Y2:WALK_Y),   // 階ごとに使う廊下を分ける
    dir:"up", walkT:0, frame:0, path:[], spot:null,
    bubble:null, bubbleT:0, nextBubble:2+Math.random()*6,
    lastActWall:Date.now(), restRetry:Math.random()*10, sprites:{}}; // 初期は"直近稼働"扱い=席で待機。12hはページ表示開始から計測
  for(const dir of ["up","down","left","right"])
    for(const leg of ["stand","walkA","walkB","sit"])
      w.sprites[dir+"_"+leg]=makeSprite(w,dir,leg);
  if(w.idle){
    const s=freeSpot(); s.taken=true; w.spot=s;
    w.state="rest"; w.timer=10+Math.random()*10;
    w.x=s.x; w.y=s.y; w.dir=s.dir;
  }else{
    w.state="desk"; w.timer=workDur(w); w.liveUntil=0;
    w.x=w.seat.x; w.y=w.seat.y;
  }
  return w;
});

function makePathToBreak(w,from,to){
  const wy=w.walkY||WALK_Y;
  return [{x:w.door,y:from.y},{x:w.door,y:wy},{x:BREAK_IN,y:wy},
          {x:to.x,y:wy},{x:to.x,y:to.y}];
}
function makePathBack(w,from){
  const wy=w.walkY||WALK_Y;
  return [{x:from.x,y:wy},{x:BREAK_IN,y:wy},{x:w.door,y:wy},
          {x:w.door,y:w.seat.y},{x:w.seat.x,y:w.seat.y}];
}
function makePathInBreak(from,to){
  return [{x:from.x,y:WALK_Y},{x:to.x,y:WALK_Y},{x:to.x,y:to.y}];
}

// ---- 案2: 実稼働の検知(office_bridge.py の /activity) ---------------------
// ローカルのClaude Code / Codex のセッションログが直近で更新されたときだけ
// 該当キャラを「作業中」にする。プロジェクト名→担当の対応はここで編集。
const ACTIVITY_MAP=[
  // 実稼働の自動検知(任意機能)。プロジェクト名/キーワード → 担当メンバー名(TEAMのnameと一致)。
  // 使う場合はここに対応表を書く。例:
  // {match:"design|ui",          name:"（デザイナー名）"},
  // {match:"code|impl|dev",       name:"（エンジニア名）"},
  // {match:"research|market",     name:"（リサーチ担当名）"},
  {match:".*", name:""},   // どれにも該当しない稼働の既定担当(空=割り当て無し)
];
const ACTIVITY_URL=qp.get("activity_url")||"activity";
let actBridge=false;
async function pollActivity(){
  try{
    const r=await fetch(ACTIVITY_URL,{cache:"no-store"});
    if(!r.ok)throw new Error(r.status);
    const list=await r.json();
    actBridge=Array.isArray(list);
    if(!actBridge)return;
    const now=performance.now();
    for(const a of list){
      const path=String(a.path||"").toLowerCase();
      const hit=ACTIVITY_MAP.find(m=>new RegExp(m.match,"i").test(path));
      if(!hit)continue;
      const w=workers.find(x=>x.name===hit.name&&!x.idle);
      if(w)w.liveUntil=now+90000;   // 検知から90秒間は作業中扱い
    }
  }catch(e){actBridge=false;}
}

// ---- Claude(チャット)作業の反映(office_state.json) ------------------------
// このチャットでClaudeが作業した内容(完了報告・作業中指示)をオフィスへ反映。
// ai_office.html と同じフォルダに office_state.json を置くと読み込まれる。
const STATE_URL=qp.get("state_url")||"office_state.json";
let stateLog=[];
function renderLog(){
  const el=document.getElementById("worklog");
  if(!el)return;
  el.innerHTML=stateLog.length?("【業務日誌】<br>"+stateLog.map(l=>"📋 "+l).join("<br>")):"";
}
async function pollState(){
  try{
    const r=await fetch(STATE_URL,{cache:"no-store"});
    if(!r.ok)throw new Error(r.status);
    const st=await r.json();
    stateLog=Array.isArray(st.log)?st.log.slice(-4):[];
    const now=performance.now();
    const waiting=st.waiting||{};   // orchestratorが算出した待機理由({名前:"〇〇待ち"})
    for(const w of workers){
      w.manual=null;
      w.waitingReason=(!w.idle&&typeof waiting[w.name]==="string")?waiting[w.name]:null;
    }
    // エージェント間連携(バトンパス/応援)の受信 → 新着はビジュアルエフェクト起動
    serverCollabs=Array.isArray(st.collaborations)?st.collaborations:[];
    for(const c of serverCollabs){
      if(c.status!=="active"&&c.status!=="pending")continue;
      const key=(c.from_agent||"")+">"+(c.to_agent||"")+"@"+(c.timestamp||"");
      if(seenCollabs.has(key))continue;
      seenCollabs.add(key);
      if(!c.timestamp||Date.now()-Date.parse(c.timestamp)<300e3)startCollabFx(c); // 新着5分以内のみ演出
    }
    refreshCollabs();
    for(const o of (st.overrides||[])){
      const w=workers.find(x=>x.name===o.name);
      if(!w)continue;
      const active=!o.until||Date.parse(o.until)>Date.now();
      if(!active)continue;
      const at=o.at?Date.parse(o.at):NaN;                    // 作業完了/開始時刻
      if(!isNaN(at))w.lastActWall=Math.max(w.lastActWall||0,at);
      if(o.status==="done"&&!isNaN(at)&&Date.now()-at>3600e3)continue; // 完了表示は1時間まで
      w.manual=o;
      if(o.status==="working"&&!w.idle){
        w.selfTask=null;                    // 本物の采配が届いたら自主タスクを差し替え
        w.liveUntil=Math.max(w.liveUntil||0,now+60000);
        w.lastActWall=Date.now();
        if(w.state==="desk")w.state="live"; // タブ非表示でもrAF待ちせず即反映
      }
      if(o.status==="done")w.selfTask=null; // 完了報告時は席で完了✓を掲示
    }
  }catch(e){}
  renderLog();
  if(typeof updateBoard==="function")updateBoard(); // rAFが止まっていても表は更新
}
pollState();
setInterval(pollState,30000);

// ---- エージェント間連携(コラボレーション)の見える化 ----------------------
// office_state.json の collaborations([{from_agent,to_agent,request_type,
// status,message,task,timestamp,until}])を読み、
//  ① 連携中の2人の間に点線コネクションライン(handoff=琥珀/help=シアン)
//  ② 依頼送信時にパケット(光のドット)が飛ぶアニメーション+💬吹き出しの対話
//  ③ 状態欄を「作業中(〇〇からの依頼)」表示
// で「誰と誰がコラボ中か」をひと目で分かるようにする。
let serverCollabs=[],demoCollabs=[],activeCollabs=[],collabByTo={};
const seenCollabs=new Set();
const collabFx=[];            // 飛行中パケット
const PACKET_MS=1400;
function refreshCollabs(){
  activeCollabs=serverCollabs.concat(demoCollabs)
    .filter(c=>c.status==="active"||c.status==="pending");
  collabByTo={};
  for(const c of activeCollabs)collabByTo[c.to_agent]=c;
  if(typeof updateBoard==="function")updateBoard();
}
function startCollabFx(c){
  const f=workers.find(w=>w.name===c.from_agent),
        t=workers.find(w=>w.name===c.to_agent);
  if(!f||!t)return;
  collabFx.push({c,f,t,start:performance.now(),arrived:false});
  f.bubble="💬 "+c.to_agent+"さんに依頼を送りました！";f.bubbleT=3;
}
function qBez(p,a,m,b){const q=1-p;return q*q*a+2*p*q*m+p*p*b;}
function drawCollabs(now){
  ctx.save();
  // ① 連携中の点線コネクションライン(軽いアーチ・流れる破線・パルス)
  for(const c of activeCollabs){
    const f=workers.find(w=>w.name===c.from_agent),
          t=workers.find(w=>w.name===c.to_agent);
    if(!f||!t)continue;
    const x1=f.x*S,y1=(f.y-12)*S,x2=t.x*S,y2=(t.y-12)*S;
    const mx=(x1+x2)/2,my=Math.min(y1,y2)-14*S;
    const pulse=.35+.2*Math.sin(now/300);
    ctx.strokeStyle=c.request_type==="help"
      ?"rgba(34,211,238,"+pulse+")":"rgba(251,191,36,"+pulse+")";
    ctx.lineWidth=2;ctx.setLineDash([5,5]);ctx.lineDashOffset=-(now/40)%10;
    ctx.beginPath();ctx.moveTo(x1,y1);ctx.quadraticCurveTo(mx,my,x2,y2);ctx.stroke();
  }
  ctx.setLineDash([]);
  // ② パケット(依頼が飛んでいく光のドット+尾)。着弾で受信側の💬吹き出し
  for(let i=collabFx.length-1;i>=0;i--){
    const e=collabFx[i],age=now-e.start;
    if(age>=PACKET_MS){
      if(!e.arrived){
        e.arrived=true;
        e.t.bubble="💬 "+e.c.from_agent+"さんから依頼受信、開始します！";e.t.bubbleT=3;
      }
      collabFx.splice(i,1);continue;
    }
    const p=age/PACKET_MS;
    const x1=e.f.x,y1=e.f.y-12,x2=e.t.x,y2=e.t.y-12;
    const mx=(x1+x2)/2,my=Math.min(y1,y2)-14;
    for(let k=3;k>=1;k--){                       // 尾(残光)
      const pp=Math.max(0,p-k*.06);
      dpx(qBez(pp,x1,mx,x2)*S,qBez(pp,y1,my,y2)*S,2,2,
          "rgba(251,191,36,"+(0.5-0.13*k)+")");
    }
    const bx=qBez(p,x1,mx,x2),by=qBez(p,y1,my,y2);
    px(bx-1,by-1,3,3,"#fff7d6"); px(bx,by,1,1,"#fbbf24");
  }
  ctx.restore();
}

let hoverW=null, hoverHold=0;
function pickWorker(e){
  const r=cv.getBoundingClientRect();
  const sx=(e.clientX-r.left)*W/r.width, sy=(e.clientY-r.top)*H/r.height;
  let best=null,bd=1e9;
  for(const w of workers){
    const lie=(w.state==="rest"&&w.spot&&w.spot.pose==="lie");
    const hw=lie?11:7, y1=lie?w.y-12:w.y-18, y2=w.y+3;
    if(Math.abs(sx-w.x)<=hw && sy>=y1 && sy<=y2){
      const d=Math.abs(sx-w.x)+Math.abs(sy-(w.y-8));
      if(d<bd){bd=d;best=w;}
    }
  }
  return best;
}

function hoverText(w){
  if(w.manual&&w.manual.status==="done"&&w.state!=="live")return "完了："+w.manual.task;
  if(w.manual&&w.manual.status==="working")return "作業中(チャット指示)："+w.manual.task;
  if(w.idle)return w.task;

  if(cc&&w.state==="live")
    return "作業中("+cc.from_agent+"からの依頼)："+((w.manual&&w.manual.task)||cc.task||w.task);
  if(w.selfTask&&w.state==="live")return "作業中(自主タスク)："+w.selfTask;
  const wait=w.waitingReason?"待機中・"+w.waitingReason:"次タスク準備中";
  if(w.state==="live")return "作業中："+w.task;
  if(w.state==="desk")return wait+"(担当："+w.task+")";
  if(w.state==="rest")return isStale(w)?"休息中・12h以上稼働なし(担当："+w.task+")"
                                        :"リフレッシュ中・まもなく復帰(担当："+w.task+")";

}

// ---- 状態ライフサイクル(明示定義・常時稼働版) ------------------------------
// 【作業中(live)になる条件】次のいずれかを満たした瞬間:
//   A. office_state.json の overrides に status:"working" が載る
//      (采配=orchestrator / 社長指示バー。until を過ぎると自動で解除)
//   B. activityブリッジが実稼働ログを検知(pollActivity → liveUntil を延長)
//   C. 自主タスク(selfTask): タスクが途切れて短いリフレッシュを終えた瞬間、
//      エージェント自身がリサーチ・改善・ドキュメント整理タスクを自己生成して
//      デスクへ戻り「作業中(自主タスク)」になる(次の采配が届いたら差し替え)
// 【リフレッシュ】タスク終了後、IDLE_TO_BREAK_MS(15秒)で休憩室へ移動し、
//   REFRESH_SEC(90〜180秒)だけ小休憩 → 自主タスクを持って即デスクへ復帰。
//   休憩室は「数分のリフレッシュ専用」であり、長時間の待機場所ではない。
// 【完了✓】完了報告から1時間は席で成果を掲示(この間はリフレッシュに出ない)。
function isLive(w){return !!(w.selfTask)||(w.liveUntil&&performance.now()<w.liveUntil);}
const STALE_MS=12*3600e3;        // 万一の長期無稼働は「休息中」表示(通常は到達しない)
const IDLE_TO_BREAK_MS=15e3;     // タスクが途切れてからリフレッシュに出るまで
function refreshDur(){return 90+Math.random()*90;} // リフレッシュは数分だけ
function isStale(w){return !w.idle&&Date.now()-(w.lastActWall||0)>STALE_MS;}
function justDone(w){return !!(w.manual&&w.manual.status==="done");} // 完了✓(1h以内)は席で表示
function shouldBreak(w){return !w.idle&&!isLive(w)&&!justDone(w)&&Date.now()-(w.lastActWall||0)>IDLE_TO_BREAK_MS;}
function updateWorker(w,dt){
  if(w.bubble){w.bubbleT-=dt;if(w.bubbleT<=0)w.bubble=null;}
  else{
    w.nextBubble-=dt;
    if(w.nextBubble<=0){
      const pool=w.idle?IDLE_BUBBLES:
        (w.state==="live"?WORK_BUBBLES:
         w.state==="desk"?DESK_BUBBLES:
         w.state==="rest"?REST_BUBBLES:null); // リフレッシュは☕とストレッチ
      if(pool)w.bubble=pool[Math.floor(Math.random()*pool.length)];
      if(w.bubble)w.bubbleT=1.6;
      w.nextBubble=4+Math.random()*7;
    }
  }
  if(w.state==="desk"){          // 席にいる(作業中への遷移待ち/完了✓表示中)
    w.dir="up";
    if(isLive(w)){w.state="live";w.lastActWall=Date.now();return;}
    if(shouldBreak(w)){          // タスクが途切れた→数分のリフレッシュへ
      w.restRetry=(w.restRetry??0)-dt;
      if(w.restRetry<=0){
        const s=freeSpot();
        if(s){s.taken=true;w.spot=s;w.state="toBreak";
          w.path=makePathToBreak(w,{x:w.x,y:w.y},s);
          w.bubble="ひと休みします☕";w.bubbleT=1.4;}
        else w.restRetry=8;      // 休憩スペースが空くまで席で待つ
      }
    }
  }
  else if(w.state==="live"){     // 実稼働を検知しているときだけ「作業中」
    w.dir="up"; w.lastActWall=Date.now();
    if(!isLive(w)){w.state="desk";}
  }
  else if(w.state==="toBreak"||w.state==="toDesk"){
    let step=40*dt;
    while(step>0&&w.path.length){
      const t=w.path[0],dx=t.x-w.x,dy=t.y-w.y,dist=Math.abs(dx)+Math.abs(dy);
      if(dist<=step){w.x=t.x;w.y=t.y;step-=dist;w.path.shift();}
      else{
        if(Math.abs(dx)>.5){w.x+=Math.sign(dx)*step;w.dir=dx>0?"right":"left";}
        else{w.y+=Math.sign(dy)*step;w.dir=dy>0?"down":"up";}
        step=0;
      }
    }
    w.walkT+=dt;w.frame=Math.floor(w.walkT*7)%2;
    if(!w.path.length){
      if(w.state==="toBreak"){
        w.state="rest";w.dir=w.spot.dir;
        w.timer=w.idle?restDur(w):refreshDur(); // 通常メンバーは数分のリフレッシュのみ
      }
      else{w.state=isLive(w)?"live":"desk";w.timer=workDur(w);w.dir="up";}
    }
  }
  else if(w.state==="rest"){
    if(w.idle){                        // 常時待機組は休憩室内をたまに移動
      w.timer-=dt;
      if(w.timer<=0){
        const s=freeSpot();
        if(s){
          w.spot.taken=false; s.taken=true;
          const from={x:w.x,y:w.y}; w.spot=s;
          w.state="toBreak"; w.path=makePathInBreak(from,s);
        }else w.timer=8;
      }
    }else{
      // 常時稼働: リフレッシュ(数分)が終わったら自主タスクを自己生成して即復帰。
      // 采配・指示・完了報告が届いた場合はその瞬間に戻る。
      w.timer-=dt;
      const called=(w.liveUntil&&performance.now()<w.liveUntil)||justDone(w);
      if(called||w.timer<=0){
        if(!called&&!w.selfTask)w.selfTask=pickSelfTask();
        w.spot.taken=false;const from={x:w.x,y:w.y};w.spot=null;
        w.state="toDesk";w.path=makePathBack(w,from);
        w.bubble=called?"お仕事だ！":"自主タスク開始！";w.bubbleT=1.4;
      }
    }
  }
}

function hWall(y){
  let x=0;

  const segs=[];
  for(const[g1,g2]of gaps){segs.push([x,g1]);x=g2;}
  segs.push([x,BREAK_X-6]);
  for(const[a,b]of segs)if(b>a){
    const w=b-a;
    dpx((a-1)*S,(y-4)*S,(w+2)*S,2,PAL.O);        // 輪郭(上)
    px(a,y-3,w,3,"#ddd6c5"); dpx(a*S,(y-3)*S,w*S,1,"#efe9d8"); // 上面キャップ
    wallFace(a,y,w);
    dpx((a-1)*S,(y-4)*S,2,(WALL_H+4)*S,PAL.O);   // 輪郭(左右)
    dpx(b*S,(y-4)*S,2,(WALL_H+4)*S,PAL.O);

function drawWorker(w){
  const f=Math.round(w.x),fy=Math.round(w.y);

    ctx.save();ctx.translate(f*S,(fy-2)*S);ctx.rotate(-Math.PI/2);
    ctx.drawImage(w.sprites["down_sit"],-12,-13);
    ctx.restore();
    nameTag(w,f,fy-14);
    drawStatusIcon(w,f,fy-14);
    return;
  }
  ctx.fillStyle="rgba(0,0,0,.22)";ctx.fillRect((f-5)*S,(fy-2)*S,10*S,3*S);

  let leg="stand";
  if(w.state==="desk"||w.state==="live"||(w.state==="rest"&&w.spot&&w.spot.pose==="sit"))leg="sit";
  else if(w.state==="toBreak"||w.state==="toDesk")leg=w.frame?"walkA":"walkB";
  const spr=w.sprites[w.dir+"_"+leg];
  const top=fy-14+(leg==="sit"?2:0)+bob;
  ctx.drawImage(spr,(f-5)*S,top*S);

  if(w.state==="desk"||w.state==="live"){
    px(f-6,fy-6,12,6,PAL.O);
    px(f-5,fy-5,10,4,"#22242c"); px(f-5,fy-5,10,1,"#3a3d48");
    px(f-2,fy,4,2,"#15161c");
  }
  if(w.state==="live"){ // タイピング演出: モニタにコードが流れてチカチカ光る
    const d=w.desk, mx=d.x+DESK_W/2-7;
    if(Math.random()<0.4)px(mx+2+Math.floor(Math.random()*7),d.y-8+Math.floor(Math.random()*6),3,1,"#c8ffe0");
    if(Math.random()<0.15)px(mx+2,d.y-8,10,7,"rgba(220,255,235,.16)");
  }
  nameTag(w,f,top-2);
  drawStatusIcon(w,f,top-2);
}
function nameTag(w,x,y){
  const label=w.name.length>6?w.name.slice(0,5)+"…":w.name;
  txt(label,x+0.5,y+0.5,12,"rgba(0,0,0,.6)","center");

}
// 頭上ステータスアイコン(カイロ風): 作業中=メモ+ペン / 休憩中=コーヒー
function drawStatusIcon(w,f,top){
  if(w.bubble)return; // 吹き出し表示中は出さない
  const t=performance.now()/400;
  const bobI=Math.round(Math.sin(t+f*0.7));
  const y=top-19+bobI; // 名前タグのさらに上に表示

  if(w.state==="live"){
    px(f-5,y,8,9,PAL.O);
    px(f-4,y+1,6,7,"#ffffff");                       // メモ用紙
    dpx((f-3)*S,(y+3)*S,4*S,1,"#9aa4b0"); dpx((f-3)*S,(y+5)*S,4*S,1,"#9aa4b0"); // 罫線
    px(f+3,y+1,2,6,"#e8a33d"); px(f+3,y+6,2,2,"#4a3520"); // 鉛筆(軸+芯)
    px(f+3,y,2,1,"#e05a6a");                          // 消しゴム
  }else if(w.state==="rest"||(w.idle&&w.state!=="toBreak")){
    px(f-4,y+3,7,6,PAL.O);
    px(f-3,y+4,5,4,"#fff8ee");                        // マグカップ
    px(f-3,y+4,5,1,"#7a4a28");                        // コーヒー
    px(f+3,y+5,2,2,PAL.O); dpx((f+3)*S,(y+5)*S+1,2,2,"#fff8ee"); // 取っ手
    if(Math.floor(t)%2===0){dpx((f-1)*S,y*S,2,2,"#e8e8e8");dpx(f*S,(y+1)*S+1,2,2,"#d8d8d8");} // 湯気
  }
}
function bubbleBox(f,top,text,bg){
  ctx.font="15px DotGothic16, monospace";
  const twD=Math.ceil(ctx.measureText(text).width)+14;
  const fD=f*S;
  const bxD=Math.min(Math.max(fD-twD/2,4),W*S-twD-4), byD=Math.max(top*S-22,4);
  dpx(bxD+2,byD+2,twD,24,"rgba(0,0,0,.25)");
  dpx(bxD+2,byD,twD-4,24,bg); dpx(bxD,byD+2,twD,20,bg);
  ctx.fillStyle=PAL.O;
  dpx(bxD+2,byD-2,twD-4,2,PAL.O); dpx(bxD+2,byD+24,twD-4,2,PAL.O);
  dpx(bxD-2,byD+2,2,20,PAL.O); dpx(bxD+twD,byD+2,2,20,PAL.O);
  dpx(bxD,byD,2,2,PAL.O); dpx(bxD+twD-2,byD,2,2,PAL.O);
  dpx(bxD,byD+22,2,2,PAL.O); dpx(bxD+twD-2,byD+22,2,2,PAL.O);
  dpx(fD-2,byD+24,6,4,bg); dpx(fD,byD+28,2,2,bg);
  dpx(fD-4,byD+26,2,2,PAL.O); dpx(fD+4,byD+26,2,2,PAL.O); dpx(fD-2,byD+30,6,2,PAL.O);
  ctx.fillStyle="#222";ctx.textAlign="center";
  ctx.fillText(text,bxD+twD/2,byD+17);
}
function drawBubble(w){
  if(!w.bubble)return;
  const top=(w.state==="rest"&&w.spot&&w.spot.pose==="lie")?w.y-16:w.y-30;
  bubbleBox(Math.round(w.x),top,w.bubble,"#ffffff");
}
function drawTaskBubble(w,text){
  const top=(w.state==="rest"&&w.spot&&w.spot.pose==="lie")?w.y-16:w.y-30;
  bubbleBox(Math.round(w.x),top,text,"#fffbe6");
}
function drawUsage(){

}

// ---- ステータス表 --------------------------------------------------------
const rows=document.getElementById("rows");
function stateLabel(w){
  if(w.manual&&w.manual.status==="done"&&w.state!=="live")return ["完了✓(1h以内)","st-work"];
  const cc=collabByTo[w.name];   // 連携(依頼)を受けて作業中なら依頼元を明示
  if(cc&&(w.state==="live"||w.state==="toDesk"))
    return ["作業中("+cc.from_agent+"からの依頼)","st-work"];
  if(w.idle)return w.state==="toBreak"?["移動中(待機)","st-idle"]:["待機中(休憩室)","st-idle"];
  if(w.selfTask&&(w.state==="live"||w.state==="toDesk"))
    return ["作業中(自主タスク)","st-work"];
  const wait=w.waitingReason?"待機中("+w.waitingReason+")":null;   // 例: 待機中(社長指示待ち)
  if(w.state==="rest")return isStale(w)?["休息中(稼働なし12h+)","st-rest"]
                                        :[wait||"リフレッシュ中(小休憩)","st-rest"];
  return {live:["作業中","st-work"],desk:[wait||"次タスク準備中","st-idle"],
          toBreak:["リフレッシュへ移動中","st-walk"],
          toDesk:["席へ戻り中","st-walk"]}[w.state]||[wait||"次タスク準備中","st-idle"];
}
function updateBoard(){
  rows.innerHTML=workers.map(w=>{
    const[l,c]=stateLabel(w);
    const task=(w.manual&&w.manual.task)?w.manual.task
              :(w.selfTask?"【自主】"+w.selfTask:w.task);
    return `<tr><td class="grp">${w.room}</td><td>${w.name}</td><td>${w.role}</td><td>${task}</td><td><span class="st ${c}">${l}</span></td></tr>`;
  }).join("");
}

// ============================================================
// 経営司令室(下半分ダッシュボード)
// データ層: company_dashboard.json(Orchestrator書込用) + 実ファイル(JOHN_TASKBOARD/VENTURE_RANKING/日報/更新ログ)
// 取得できない値は「未接続/集計待ち」を表示し、架空の数字は出さない
// ============================================================
const DASH={db:null,rank:[],lab:null,tb:null,evo:"",errs:[]};
const KB_DIR="AIチーム_ナレッジ";
function encPath(p){return p.split("/").map(encodeURIComponent).join("/");}
async function ccFetch(p){const r=await fetch(encPath(p)+"?t="+Date.now(),{cache:"no-store"});if(!r.ok)throw new Error(p);return r.text();}
function ccEsc(s){return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

async function loadDash(){
  DASH.errs=[];
  try{DASH.db=JSON.parse(await ccFetch("company_dashboard.json"));}
  catch(e){DASH.db=null;DASH.errs.push("dashboard.json未接続");}
  try{ // VENTUREランキング
    const t=await ccFetch(KB_DIR+"/ai_lab/VENTURE_RANKING.md");
    DASH.rank=[...t.matchAll(/^\|\s*(\d+)\s*\|\s*(VENTURE-[^|\s]+)\s*\|([^|]*)\|\s*(\d+)\s*\|([^|]*)\|([^|]*)\|/gm)]
      .map(m=>({no:+m[1],id:m[2],name:m[3].trim(),score:+m[4],state:m[5].trim(),diff:m[6].trim()}));
  }catch(e){DASH.rank=null;}
  try{ // ジョンの采配盤
    const t=await ccFetch(KB_DIR+"/JOHN_TASKBOARD.md");
    const sec=h=>{const m=t.split(/^## /m).find(s=>s.startsWith(h));
      return m?m.split("\n").filter(l=>/^- /.test(l)).map(l=>l.replace(/^- /,"")).filter(l=>!/^\(な(し|ん)?\)|^\(なし\)/.test(l.trim())&&l.trim()!=="(なし)"):[];};
    DASH.tb={p01:sec("P0"),p23:sec("P2"),p45:sec("P4"),blockers:sec("ブロッカー")};
  }catch(e){DASH.tb=null;}
  try{ // 本日のLAB日報(あれば)
    const dir=await ccFetch(KB_DIR+"/ai_lab/DAILY_LAB_REPORT/");
    const files=[...dir.matchAll(/href="([0-9]{4}-[0-9]{2}-[0-9]{2})\.md"/g)].map(m=>m[1]).sort();
    if(files.length){
      const rep=await ccFetch(KB_DIR+"/ai_lab/DAILY_LAB_REPORT/"+files[files.length-1]+".md");
      const num=re=>{const m=rep.match(re);return m?+m[1]:null;};
      DASH.lab={date:files[files.length-1],
        found:num(/機会[^\d]{0,10}(\d+)\s*件/), created:num(/事業案[^\d]{0,10}(\d+)\s*件/),
        passed:num(/審査通過[^\d]{0,10}(\d+)/), running:num(/実験中[^\d]{0,10}(\d+)/)};
    }else DASH.lab=null;
  }catch(e){DASH.lab=null;}
  try{ // 進化の一文(更新ログの最新)
    const t=await ccFetch(KB_DIR+"/_更新ログ.md");
    const rows=t.trim().split("\n").filter(l=>/^\d{4}-\d{2}-\d{2} \|/.test(l));
    DASH.evo=(DASH.db&&DASH.db.evolution)||(rows.length?rows[rows.length-1].split("|")[2]||"":"");
  }catch(e){if(DASH.db&&DASH.db.evolution)DASH.evo=DASH.db.evolution;}
  renderDash();
}

function ccMoney(v){return v==null?'<span class="v na">未接続</span>':'<span class="v">¥'+Number(v).toLocaleString()+'</span>';}
function renderDash(){
  const db=DASH.db||{};
  // ① TODAY'S COMMAND
  {
    const el=document.getElementById("cc_command");let h="";
    for(const k of (db.kenta_direct||[]))h+='<div class="cckenta">🔴 オーナー指示: '+ccEsc(k)+'</div>';
    h+='<div class="ccobj"><span class="lbl">TODAY\'S PRIMARY OBJECTIVE</span>'+ccEsc(db.objective||"(未設定 — JOHN_TASKBOARDに従い自律運転)")+'</div>';
    const tasks=DASH.tb?[...DASH.tb.p01,...DASH.tb.p23].slice(0,5):[];
    if(tasks.length){
      tasks.forEach((t,i)=>{
        const pm=t.match(/進捗[:：]?\s*(\d+)%/);
        const who=(t.match(/\(([^)]+)\)[:：]?/)||[])[1]||"";
        h+='<div class="cctask"><span class="no">0'+(i+1)+'</span><span class="tx">'+ccEsc(t.replace(/進捗[:：]?\s*\d+%/,""))+'</span>'
          +(who?'<span class="who">'+ccEsc(who)+'</span>':"")
          +(pm?'<span class="ccbar"><i style="width:'+pm[1]+'%"></i></span>':"")+'</div>';
      });
    }else h+='<div class="cctask"><span class="tx" style="color:#6b769c">采配盤(JOHN_TASKBOARD.md)未接続</span></div>';
    const ap=db.approvals||{};
    h+='<div class="ccappr"><b>'+(ap.pending??"—")+'</b>承認待ち'+(ap.estimated_review_time?'　想定確認時間 '+ccEsc(ap.estimated_review_time):"")+'</div>';
    el.innerHTML=h;
  }
  // ② 24H MONEY ENGINE
  {
    const el=document.getElementById("cc_money");
    const rv=db.revenue||{},ac=db.ai_cost||{},me=db.money_engine||{};
    let h='<div class="ccmoneygrid">'
      +'<div class="ccmoney hero"><div class="k">TODAY REVENUE</div>'+ccMoney(rv.today)+'</div>'
      +'<div class="ccmoney hero"><div class="k">MONTH REVENUE</div>'+ccMoney(rv.month)+'</div>'
      +'<div class="ccmoney hero"><div class="k">REALIZED PROFIT</div>'+ccMoney(rv.realized_profit)+'</div>'
      +'<div class="ccmoney"><div class="k">AI COST</div>'+ccMoney(ac.today)+'</div>'
      +'<div class="ccmoney"><div class="k">AI BUDGET LEFT</div>'+ccMoney(ac.budget_remaining)+'</div>'
      +'<div class="ccmoney"><div class="k">AI ROI</div>'+(ac.roi==null?'<span class="v na">集計待ち</span>':'<span class="v">'+ccEsc(ac.roi)+'x</span>')+'</div>'
      +'</div>';
    const g=(k,v)=>k+' <b>'+(v==null?"—":v)+'</b>';
    h+='<div class="ccminirow">'
      +'<span>'+g("機会",me.opportunities)+'</span><span>'+g("実験中",me.experiments)+'</span>'
      +'<span>'+g("SCALE候補",me.scale_candidates)+'</span><span>'+g("収益発生",me.revenue_generating)+'</span>'
      +'<span class="ccmode">BUDGET MODE <b>'+ccEsc(ac.mode||"NORMAL")+'</b></span></div>';
    el.innerHTML=h;
  }
  // ③ AI LAB LIVE
  {
    const el=document.getElementById("cc_lab");let h="";
    const L=DASH.lab;
    h+='<div class="cclabstats">'
      +'<span>TODAY機会 <b>'+(L&&L.found!=null?L.found:"—")+'</b></span>'
      +'<span>事業案 <b>'+(L&&L.created!=null?L.created:"—")+'</b></span>'
      +'<span>審査通過 <b>'+(L&&L.passed!=null?L.passed:"—")+'</b></span>'
      +'<span>実験中 <b>'+(L&&L.running!=null?L.running:"—")+'</b></span>'
      +(L?'':'<span style="color:#6b769c">初回自動運転待ち(毎朝7:08)</span>')+'</div>';
    if(DASH.rank===null)h+='<div class="ccventure"><span style="color:#6b769c">VENTURE_RANKING.md 未接続</span></div>';
    else if(!DASH.rank.length)h+='<div class="ccventure"><span style="color:#6b769c">候補なし — 初回のLAB自動運転で生成されます</span></div>';
    else DASH.rank.slice(0,3).forEach(v=>{
      h+='<div class="ccventure"><div class="top"><span class="rank">#'+v.no+'</span><span class="nm">'+ccEsc(v.name||v.id)+'</span><span class="sc">'+v.score+'</span></div>'
        +'<div class="meta"><span class="ccphase">'+ccEsc(v.state||"—")+'</span>'+ccEsc(v.id)+(v.diff?"　"+ccEsc(v.diff):"")+'</div></div>';
    });
    el.innerHTML=h;
  }
  // ④ COMPANY PULSE
  {
    const el=document.getElementById("cc_pulse");
    const cnt=s=>workers.filter(w=>w.state===s).length;
    const working=cnt("live"),waiting=cnt("desk"),resting=workers.filter(w=>w.state==="rest").length,
      moving=cnt("toBreak")+cnt("toDesk"),
      doneToday=workers.filter(w=>w.manual&&w.manual.status==="done").length;
    const blocked=DASH.tb?DASH.tb.blockers.length:0;
    const appr=(db.approvals&&db.approvals.pending)??0;
    const sh=db.system_health||{};
    const errs=[...(sh.errors||[]),...DASH.errs.filter(e=>e!=="dashboard.json未接続")];
    let h="";
    if(errs.length||blocked>0)h+='<div class="cchealth bad">⚠ ATTENTION REQUIRED — '+(blocked?blocked+' BLOCKED ':'')+(errs.length?errs.length+' ERROR':'')+'</div>';
    else h+='<div class="cchealth ok">✓ ALL SYSTEMS NORMAL</div>';
    h+='<div class="ccpulsegrid">'
      +'<div class="ccpulse ok"><div class="k">WORKING</div><div class="v">'+working+'</div></div>'
      +'<div class="ccpulse"><div class="k">WAITING</div><div class="v">'+waiting+'</div></div>'
      +'<div class="ccpulse"><div class="k">RESTING</div><div class="v">'+(resting+moving)+'</div></div>'
      +'<div class="ccpulse '+(blocked?"bad":"")+'"><div class="k">BLOCKED</div><div class="v">'+blocked+'</div></div>'
      +'<div class="ccpulse '+(appr?"warn":"")+'"><div class="k">APPROVAL</div><div class="v">'+appr+'</div></div>'
      +'<div class="ccpulse ok"><div class="k">DONE(直近)</div><div class="v">'+doneToday+'</div></div>'
      +'</div>';
    if(DASH.tb&&DASH.tb.blockers.length)h+=DASH.tb.blockers.slice(0,3).map(b=>'<div class="ccblock">⛔ '+ccEsc(b)+'</div>').join("");
    if(DASH.evo)h+='<div class="ccevo"><span class="lbl">TODAY\'S EVOLUTION</span>'+ccEsc(DASH.evo)+'</div>';
    el.innerHTML=h;
  }
}
// 運転状態バー(1秒ごと)
function ccClock(){
  const now=new Date();
  document.getElementById("cc_last").textContent=now.toTimeString().slice(0,8);
  const cyc=(DASH.db&&DASH.db.cycles)||[{name:"LAB 02",time:"07:08"},{name:"YouTube",time:"08:39"},{name:"JOHN LOOP",time:"18:38"}];
  let best=null;
  for(const c of cyc){
    const[hh,mm]=c.time.split(":").map(Number);
    const t=new Date(now);t.setHours(hh,mm,0,0);
    if(t<=now)t.setDate(t.getDate()+1);
    if(!best||t<best.t)best={t,name:c.name};
  }
  if(best){
    const s=Math.floor((best.t-now)/1000);
    const hh=String(Math.floor(s/3600)).padStart(2,"0"),mm=String(Math.floor(s%3600/60)).padStart(2,"0"),ss=String(s%60).padStart(2,"0");
    document.getElementById("cc_next").textContent=best.name+" "+hh+":"+mm+":"+ss;
  }
}
loadDash();
setInterval(loadDash,30000);
